<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Outer Broken Ring Gradient: Electric Sky to Deep Sapphire Cobalt -->
    <linearGradient id="ringGrad" x1="80" y1="60" x2="430" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Segment 1 (Front Left): Soft Sky Ice to Sapphire Cobalt -->
    <linearGradient id="seg1Grad" x1="105" y1="190" x2="215" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Segment 2 (Back Center-Left): Deep Midnight Navy Obsidian Shadow under fold -->
    <linearGradient id="seg2Grad" x1="195" y1="365" x2="255" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090e1c" />
      <stop offset="55%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#090e1c" />
    </linearGradient>

    <!-- Segment 3 (Front Center-Right): Electric Sky Arch to Vibrant Sapphire -->
    <linearGradient id="seg3Grad" x1="245" y1="220" x2="345" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="38%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Segment 4 (Back Right): Deep Navy Shadow at bottom fold to Ice Sky Top Cap -->
    <linearGradient id="seg4Grad" x1="330" y1="365" x2="425" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090e1c" />
      <stop offset="30%" stop-color="#1e3a8a" />
      <stop offset="68%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Cursor Arrow Upper-Left Facet: Cyan Highlight to Ice Blue -->
    <linearGradient id="arrowTopGrad" x1="125" y1="145" x2="220" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Cursor Arrow Lower-Right Facet: Royal Cobalt to Deep Sapphire -->
    <linearGradient id="arrowBotGrad" x1="168" y1="152" x2="215" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Exact W Silhouette Mask with full 512x512 userSpaceOnUse bounds -->
    <mask id="wRibbonMask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="0" width="512" height="512" fill="black" />
      <path
        d="M 122 232 L 194 358 L 262 262 L 330 358 L 402 232"
        stroke="white"
        stroke-width="84"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </mask>
  </defs>

  <!-- 1. OUTER BROKEN SAPPHIRE RING -->
  <path
    d="M 483.5 202.5
       A 236 236 0 1 0 488.5 224.5
       L 476.5 215.5
       L 460.5 246.5
       A 204 204 0 1 1 441.5 170.5
       L 483.5 202.5 Z"
    fill="url(#ringGrad)"
  />

  <!-- 2. TWO-FACET NAVIGATION ARROW / CURSOR POINTER -->
  <path
    d="M 218 110
       L 124 146
       C 120 147.5 120.5 151.5 124.5 152.5
       L 168 161
       L 218 110 Z"
    fill="url(#arrowTopGrad)"
  />
  <path
    d="M 218 110
       L 168 161
       L 176.5 201
       C 177.5 205 181.5 205.5 183 201.5
       L 218 110 Z"
    fill="url(#arrowBotGrad)"
  />

  <!-- 3. 3D FOLDED RIBBON "W" -->
  <g mask="url(#wRibbonMask)">
    <!-- Back Segment 2: Bottom-Left Valley -> Center Peak -->
    <line
      x1="194"
      y1="358"
      x2="262"
      y2="262"
      stroke="url(#seg2Grad)"
      stroke-width="88"
      stroke-linecap="round"
    />

    <!-- Back Segment 4: Bottom-Right Valley -> Far-Right Peak -->
    <line
      x1="330"
      y1="358"
      x2="402"
      y2="232"
      stroke="url(#seg4Grad)"
      stroke-width="88"
      stroke-linecap="round"
    />

    <!-- Segment 1 Round Start Cap -->
    <circle cx="122" cy="232" r="44" fill="url(#seg1Grad)" />

    <!-- Front Segment 1: Far-Left Peak -> Bottom-Left Valley -->
    <path
      d="M 75 253
         L 159.5 211
         L 231.5 337
         L 208 408
         L 75 408 Z"
      fill="url(#seg1Grad)"
    />

    <!-- Front Segment 3: Center Peak -> Bottom-Right Valley -->
    <path
      d="M 205 270
         L 227 236
         C 242 214 282 214 297 236
         L 365.5 335
         L 343 408
         L 278 408
         L 246 314
         C 235 270 218 256 205 270 Z"
      fill="url(#seg3Grad)"
    />
  </g>
</svg>
